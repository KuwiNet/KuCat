name: Auto Build KuCat on Changes

# 触发条件：修改主题文件或编译脚本时自动运行
on:
  push:
    branches: [ js ]  # 监测js分支的推送
    paths:
      - 'luci-theme-kucat/**'  # 主题文件修改时触发
      - 'build_auto.sh'       # 编译脚本修改时触发
  pull_request:
    branches: [ js ]
    paths:
      - 'luci-theme-kucat/**'
      - 'build_auto.sh'
  workflow_dispatch:  # 保留手动触发选项

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Make build script executable
        run: chmod +x build_auto.sh

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc \
            wget unzip python3 libarchive-tools

      - name: Run build script
        run: ./build_auto.sh  # 直接调用编译脚本

      - name: Upload all.ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-kucat-all
          path: ${{ env.IPK_PATH }}  # 从脚本导出的IPK路径

      # 仅在推送到js分支时创建预发布（可选）
      - name: Create pre-release for js branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/js'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release-${{ github.sha }}  # 用commit哈希作为临时标签
          name: KuCat Pre-release (js branch)
          body: |
            自动构建于 ${{ github.sha }}
            包含最新主题文件和脚本修改
          files: ${{ env.IPK_PATH }}
          prerelease: true  # 标记为预发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
