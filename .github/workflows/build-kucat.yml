name: Build LuCI Theme

on:
  push:
    branches: [ js ]
    paths:
      - 'luci-theme-kucat/**'
      - 'build_auto.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            binutils \
            curl \
            coreutils \
            file \
            bsdtar \
            arj \
            build-essential

      - name: Setup & Build
        run: |
          chmod +x build_auto.sh
          ./build_auto.sh

      - name: Verify IPK format
        run: |
          if [ -f "bin/all-archs"/*.ipk ]; then
            ar t "bin/all-archs"/*.ipk || exit 1
            echo "✅ IPK format verified"
          else
            echo "❌ No IPK file found"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-kucat
          path: bin/all-archs/*.ipk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/js'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: bin/all-archs/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
