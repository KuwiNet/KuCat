name: Build LuCI Theme

on:
  push:
    branches: [ js ]
    paths:
      - 'luci-theme-kucat/**'
      - 'build_auto.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup & Build
        run: |
          chmod +x build_auto.sh
          sudo apt-get update
          sudo apt-get install -y wget binutils curl
          ./build_auto.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          path: bin/all-archs/*.ipk

      - name: Create Release
        if: github.ref == 'refs/heads/js'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: bin/all-archs/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
