name: Build LuCI Theme

on:
  push:
    branches: [ js ]
    paths:
      - 'luci-theme-kucat/**'
      - 'build_auto.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              wget \
              binutils \
              curl \
              coreutils \
              file \
              libarchive-tools \
              arj \
              build-essential

      - name: Setup & Build
        run: |
          chmod +x build_auto.sh
          sudo apt-get update
          sudo apt-get install -y wget binutils curl coreutils file bsdtar
          ./build_auto.sh 2>&1 | tee build.log

      - name: Verify IPK format
        run: |
          if [ ! -d "bin/all-archs" ]; then
            echo "❌ bin/all-archs directory not found"
            exit 1
          fi
          
          IPK_FILE=$(ls bin/all-archs/*.ipk 2>/dev/null | head -n 1)
          if [ -z "$IPK_FILE" ]; then
            echo "❌ No IPK file found in bin/all-archs/"
            exit 1
          fi
          
          if ! ar t "$IPK_FILE"; then
            echo "❌ Invalid IPK format: $IPK_FILE"
            exit 1
          fi
          echo "✅ IPK format verified: $IPK_FILE"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-kucat
          path: bin/all-archs/*.ipk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/js'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luci-theme-kucat-${{ github.sha }}
          name: Release ${{ github.sha }}
          body: "Automated build of LuCI Kucat theme"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: bin/all-archs/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
