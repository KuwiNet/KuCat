name: Build and Release LuCI Theme Kucat

on:
  push:
    paths:
      - 'luci-theme-kucat/**'
      - 'build_auto.sh'
    branches:
      - js

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract PKG_VERSION for Release Tag
        id: get_version
        run: |
          VERSION=$(awk -F'[ =]+' '/^PKG_VERSION:/ {print $2}' luci-theme-kucat/Makefile | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Make Build Script Executable
        run: chmod +x build_auto.sh

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar xz-utils binutils

      - name: Run Build Script
        run: ./build_auto.sh

      - name: Verify Output
        run: |
          echo "🔍 Final IPK files:"
          find bin/all-archs -type f -name "*.ipk" -ls

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: bin/all-archs/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
