name: Build KuCat Theme

on:
  push:
    branches: [ js ]
    paths:
      - 'luci-theme-kucat/**'
      - 'build_auto.sh'
      - '.github/workflows/build_kucat.yml'
  pull_request:
    branches: [ js ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Make build script executable
        run: chmod +x build_auto.sh

      - name: Install system dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc \
            wget unzip python3 libarchive-tools

      - name: Run build script
        run: ./build_auto.sh

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-kucat-all
          path: ${{ env.IPK_PATH }}

      - name: Create pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/js'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_TAG }}
          name: KuCat Theme v${{ env.RELEASE_TAG }}
          body: |
            ## KuCat Theme v${{ env.RELEASE_TAG }}
            通用all架构版，适用于所有OpenWrt设备
            
            - 作者: KuwiNet
            - 构建日期: $(date +%Y-%m-%d)
          files: ${{ env.IPK_PATH }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
