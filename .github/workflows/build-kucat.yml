name: Build and Release LuCI Theme Kucat

on:
  push:
    paths:
      - 'luci-theme-kucat/Makefile'
    branches:
      - js

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PKG_VERSION from Makefile
        id: get_version
        run: |
          VERSION=$(awk -F'[ =]+' '/^PKG_VERSION:/ {print $2}' luci-theme-kucat/Makefile | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "full_version=${VERSION}-r$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Make build_auto.sh executable
        run: chmod +x build_auto.sh

      - name: Run build_auto.sh to generate .ipk
        run: ./build_auto.sh

      - name: Verify generated .ipk files
        run: |
          echo "🔍 Checking generated IPKs:"
          find bin/all-archs -name "*.ipk" -ls
          if ! ls bin/all-archs/*.ipk > /dev/null 2>&1; then
            echo "❌ No .ipk files found in bin/all-archs/"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: bin/all-archs/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
