name: Build KuCat Theme & Create Release

on:
  push:
    tags:  # 标签推送触发（如 v1.0.0）
      - 'v*'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 扩展支持的架构（需与 build_auto.sh 兼容）
        target: [x86_64, armvirt-64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Make build script executable
        run: |
          # 确保本地编译脚本有执行权限
          chmod +x build_auto.sh

      - name: Install system dependencies
        run: |
          # 安装 build_auto.sh 所需的系统工具
          sudo apt update -y
          sudo apt install -y \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc \
            wget unzip python3 libarchive-tools  # 包含 bsdtar 等验证工具

      - name: Run build script for ${{ matrix.target }}
        env:
          # 向脚本传递目标架构参数（需修改 build_auto.sh 支持多架构）
          TARGET_ARCH: ${{ matrix.target }}
        run: |
          # 执行本地编译脚本，复用其逻辑（下载SDK、编译等）
          ./build_auto.sh

      - name: Collect build artifacts
        run: |
          # 创建架构专属输出目录
          mkdir -p output/${{ matrix.target }}
          # 从脚本导出的环境变量中获取IPK路径
          cp ${{ env.IPK_PATH }} output/${{ matrix.target }}/

      - name: Upload per-architecture IPK
        uses: actions/upload-artifact@v4
        with:
          name: kuci-theme-kucat-${{ matrix.target }}
          path: output/${{ matrix.target }}/*.ipk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          cp all_artifacts/*.ipk release_assets/
          # 生成校验和文件
          cd release_assets && sha256sum *.ipk > SHA256SUMS.txt && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KuCat Theme ${{ github.ref_name }}
          body: |
            ## KuCat Theme ${{ github.ref_name }}
            自动构建的LuCI主题包，支持多架构：
            - x86_64
            - armvirt-64
            
            ### 安装方法
            1. 下载对应架构的IPK文件
            2. 通过SSH执行：`opkg install luci-theme-kucat_*.ipk`
          files: |
            release_assets/*.ipk
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
