name: Build LuCI Theme

on:
  push:
    branches: [ js ]
    paths:
      - 'luci-theme-kucat/**'
      - 'build_auto.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup & Build
        run: |
          chmod +x build_auto.sh
          sudo apt-get update
          sudo apt-get install -y wget binutils
          ./build_auto.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          path: bin/all-archs/*.ipk
