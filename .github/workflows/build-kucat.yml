name: Build and Release .ipk

on:
  push:
    paths:
      - 'luci-theme-kucat/Makefile'
    branches:
      - js

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PKG_VERSION from Makefile
        id: get_version
        run: |
          VERSION=$(awk -F'[ =]+' '/^PKG_VERSION:/ {print $2}' luci-theme-kucat/Makefile | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create output directory
        run: mkdir -p out

      - name: Copy unminified CSS files
        run: |
          mkdir -p luci-theme-kucat/htdocs/luci-static/kucat/css
          curl -fsSL https://raw.githubusercontent.com/KuwiNet/KuCat/js/luci-theme-kucat/htdocs/luci-static/kucat/css/cascade.css -o luci-theme-kucat/htdocs/luci-static/kucat/css/cascade.css
          curl -fsSL https://raw.githubusercontent.com/KuwiNet/KuCat/js/luci-theme-kucat/htdocs/luci-static/kucat/css/style.css -o luci-theme-kucat/htdocs/luci-static/kucat/css/style.css

      - name: Build .ipk package
        run: |
          cd luci-theme-kucat
          # 创建 data.tar.gz
          tar -czf ../out/data.tar.gz htdocs --owner=0 --group=0
          cd ..

          # 创建 control.tar.gz
          mkdir -p tmp_control
          cat > tmp_control/control << EOF
Package: luci-theme-kucat
Version: ${{ steps.get_version.outputs.version }}
Section: luci
Category: Themes
Architecture: all
Maintainer: KuwiNet
Description: A beautiful LuCI theme
EOF
          tar -czf out/control.tar.gz -C tmp_control . --owner=0 --group=0

          # 创建 debian-binary
          echo "2.0" > out/debian-binary

          # 合并成 .ipk
          ar r out/luci-theme-kucat_${{ steps.get_version.outputs.version }}_all.ipk out/debian-binary out/control.tar.gz out/data.tar.gz

      - name: Create Release and Upload .ipk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: out/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
