name: 构建 LuCI 主题 Kucat

# 触发条件：推送到js分支、手动触发、PR到js分支
on:
  push:
    branches: [ js ]
    paths:
      - 'luci-theme-kucat/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ js ]
    paths:
      - 'luci-theme-kucat/**'
      - 'build_auto.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 \
            libarchive-tools

      - name: 执行构建脚本
        run: |
          chmod +x build_auto.sh  # 确保脚本可执行
          ./build_auto.sh  # 运行你的构建脚本

      - name: 上传IPK作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-kucat-${{ env.RELEASE_TAG }}
          path: ${{ env.IPK_PATH }}
          retention-days: 90

      - name: 创建GitHub Release
        if: github.event_name != 'pull_request'  # PR时不创建Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Kucat 主题 ${{ env.RELEASE_TAG }}
          body: |
            ## 自动构建信息
            - 版本: ${{ env.RELEASE_TAG }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
            - 提交哈希: ${{ github.sha }}
          files: ${{ env.IPK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
