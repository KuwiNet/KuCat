name: Build and Release .ipk

on:
  push:
    paths:
      - 'luci-theme-kucat/Makefile'
    branches:
      - js

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Extract PKG_VERSION from Makefile
        id: get_version
        run: |
          # 提取 luci-theme-kucat/Makefile 中的 PKG_VERSION
          VERSION=$(grep '^PKG_VERSION:' luci-theme-kucat/Makefile | head -n1 | cut -d'=' -f2 | xargs)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper

      - name: Copy unminified CSS files
        run: |
          mkdir -p luci-theme-kucat/htdocs/luci-static/kucat/css
          # 直接从 js 分支下载 CSS 文件（不压缩）
          curl -fsSL https://raw.githubusercontent.com/KuwiNet/KuCat/js/luci-theme-kucat/htdocs/luci-static/kucat/css/cascade.css > luci-theme-kucat/htdocs/luci-static/kucat/css/cascade.css
          curl -fsSL https://raw.githubusercontent.com/KuwiNet/KuCat/js/luci-theme-kucat/htdocs/luci-static/kucat/css/style.css > luci-theme-kucat/htdocs/luci-static/kucat/css/style.css
          # 可根据需要添加更多 CSS 文件

      - name: Build .ipk package
        working-directory: ./luci-theme-kucat
        run: |
          # 使用 make 或 opkg 打包工具构建 ipk
          # 假设你使用的是 OpenWrt 的 Makefile 结构，可直接调用 make
          # 如果没有依赖问题，可以模拟打包过程
          tar -czf data.tar.gz htdocs --owner=0 --group=0
          echo "2.0" > debian-binary
          touch control
          echo "Package: luci-theme-kucat
Version: ${{ steps.get_version.outputs.version }}
Section: luci
Category: Themes
Architecture: all
Maintainer: KuwiNet
Description: A beautiful LuCI theme
" > control
          tar -czf control.tar.gz control --owner=0 --group=0
          # 合并成 .ipk
          ar r ../luci-theme-kucat_${{ steps.get_version.outputs.version }}_all.ipk debian-binary control.tar.gz data.tar.gz

      - name: Create Release and Upload .ipk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
