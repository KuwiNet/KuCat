name: Build KuCat Universal Theme & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-universal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare environment
        run: |
          # 安装依赖工具
          sudo apt update -y
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 libarchive-tools
          
          # 赋予脚本执行权限
          chmod +x build_auto.sh

      - name: Build universal IPK (all architecture)
        run: |
          # 执行编译脚本，生成通用all架构包
          ./build_auto.sh

      - name: Verify and rename IPK
        run: |
          # 从环境变量获取编译产物路径
          IPK_PATH=${{ env.IPK_PATH }}
          
          # 验证文件存在
          if [ ! -f "$IPK_PATH" ]; then
            echo "❌ 错误：未找到编译生成的IPK文件"
            exit 1
          fi
          
          # 重命名为通用格式（含版本号和all标识）
          VERSION_TAG=${{ github.ref_name }}
          UNIVERSAL_IPK="luci-theme-kucat_${VERSION_TAG}_all.ipk"
          cp "$IPK_PATH" "$UNIVERSAL_IPK"
          
          # 输出最终文件信息
          echo "✅ 通用IPK生成完成：$UNIVERSAL_IPK"
          ls -lh "$UNIVERSAL_IPK"
          
          # 导出重命名后的路径
          echo "UNIVERSAL_IPK=$UNIVERSAL_IPK" >> $GITHUB_ENV

      - name: Create release assets
        run: |
          # 创建发布资产目录
          mkdir -p release_assets
          # 复制通用IPK
          cp ${{ env.UNIVERSAL_IPK }} release_assets/
          # 生成校验和
          cd release_assets && sha256sum *.ipk > SHA256SUMS.txt && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KuCat Theme ${{ github.ref_name }}
          body: |
            ## KuCat Theme ${{ github.ref_name }}
            通用架构版本（all），适用于所有OpenWrt设备
            
            ### 安装方法
            1. 下载 luci-theme-kucat_${{ github.ref_name }}_all.ipk
            2. 通过SSH执行：`opkg install luci-theme-kucat_${{ github.ref_name }}_all.ipk`
            3. 刷新LuCI页面即可生效
          files: |
            release_assets/*.ipk
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
